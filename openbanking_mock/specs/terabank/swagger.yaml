  '/0.8/v1/accounts/{account-id}':
    get:
      tags:
        - Accounts
      summary: Read account details
      description: 'Reads details about an account, with balances where required.  It is assumed that a consent of the PSU to  this access is already given and stored on the ASPSP system.  The addressed details of this account depends then on the stored consent addressed by consentId,  respectively the OAuth2 access token.  **NOTE:** The account-id can represent a multicurrency account.  In this case the currency code is set to ''XXX''.  Give detailed information about the addressed account.  Give detailed information about the addressed account together with balance information'
      parameters:
        - name: Consent-ID
          in: header
          description: 'ConsentId of the related AIS consent, which was performed prior to this payment initiation.'
          required: true
          schema:
            maxLength: 36
            minLength: 0
            type: string
        - name: account-id
          in: path
          description: This identification is denoting the addressed (card) account.  The account-id is retrieved by using a 'Read Account List' or 'Read Card Account list' call.  The account-id is the 'resourceId' attribute of the account structure.  Its value is constant at least throughout the lifecycle of a given consent.
          required: true
          schema:
            type: string
        - name: withBalance
          in: query
          description: 'If contained, this function reads the list of accessible payment accounts including the booking balance,  if granted by the PSU in the related consent and available by the ASPSP.  This parameter might be ignored by the ASPSP.'
          schema:
            type: boolean
      responses:
        '200':
          description: Success
          content:

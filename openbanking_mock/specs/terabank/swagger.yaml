            $ref: '#/components/schemas/EntryDetailsElement'
          description: Might be used by the ASPSP to transport details about transactions within a batch.
          nullable: true
        additionalInformation:
          maxLength: 500
          minLength: 0
          type: string
          description: Might be used by the ASPSP to transport additional transaction related information to the PSU
          nullable: true
        additionalInformationStructured:
          $ref: '#/components/schemas/AdditionalInformationStructured'
        purposeCode:
          $ref: '#/components/schemas/PurposeCode'
        bankTransactionCode:
          type: string
          description: "Bank transaction code as used by the ASPSP and using the sub elements of this structured code defined by ISO 20022.\r\nThis code type is concatenating the three ISO20022 Codes\r\nDomain Code,\r\nFamily Code, and\r\nSubFamily Code by hyphens, resulting in 'DomainCode'-'FamilyCode'-'SubFamilyCode'. For standing order reports the following codes are applicable:\r\n* \"PMNT-ICDT-STDO\" for credit transfers,\r\n* \"PMNT-IRCT-STDO\" for instant credit transfers\r\n* \"PMNT-ICDT-XBST\" for cross-border credit transfers\r\n* \"PMNT-IRCT-XBST\" for cross-border real time credit transfers and\r\n* \"PMNT-MCOP-OTHR\" for specific standing orders which have a dynamical amount to move left funds e.g. on month end to a saving account"
          nullable: true
        proprietaryBankTransactionCode:
          maxLength: 35
          minLength: 0
          type: string
          description: Proprietary bank transaction code as used within a community or within an ASPSP e.g. for MT94x based transaction reports.
          nullable: true
        balanceAfterTransaction:
          $ref: '#/components/schemas/Balance'
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HrefType'
          description: Gets or Sets Links
          nullable: true

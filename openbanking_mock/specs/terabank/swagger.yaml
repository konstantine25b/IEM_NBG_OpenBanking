  '/0.8/v1/accounts/{account-id}/transactions':
    get:
      tags:
        - Accounts
      summary: Read transaction list of an account
      description: "Read transaction reports or transaction lists of a given account dressed by 'account-id', depending on the steering parameter 'bookingStatus' together with balances.\r\n            For a given account, additional parameters are e.g. the attributes 'dateFrom' and 'dateTo'.\r\n            The ASPSP might add balance information, if transaction lists without balances are not supported."
      parameters:
        - name: Consent-ID
          in: header
          description: 'ConsentId of the related AIS consent, which was performed prior to this payment initiation.'
          required: true
          schema:
            maxLength: 36
            minLength: 0
            type: string
        - name: account-id
          in: path
          description: "This identification is denoting the addressed (card) account.\r\n            The account-id is retrieved by using a 'Read Account List' or 'Read Card Account list' call.\r\n            The account-id is the 'resourceId' attribute of the account structure.\r\n            Its value is constant at least throughout the lifecycle of a given consent."
          required: true
          schema:
            type: string
        - name: bookingStatus
          in: query
          description: "Permitted codes are\r\n              * 'information',\r\n              * 'booked',\r\n              * 'pending', and\r\n              * 'both'\r\n              'booked' shall be supported by the ASPSP.\r\n              To support the 'pending' and 'both' feature is optional for the ASPSP,  Error code if not supported in the online banking frontend"
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: dateFrom
          in: query
          description: 'Conditional: Starting date (inclusive the date dateFrom) of the transaction list, mandated if no delta access is required and if bookingStatus does not equal ''information''. For booked transactions, the relevant date is the booking date. For pending transactions, the relevant date is the entry date, which may not be transparent  neither in this API nor other channels of the ASPSP.'
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: 'End date (inclusive the data dateTo) of the transaction list, default is ''now'' if not given.   Might be ignored if a delta function is used. For booked transactions, the relevant date is the booking date. For pending transactions, the relevant date is the entry date, which may not be transparent  neither in this API nor other channels of the ASPSP.'
          schema:
            type: string
            format: date
        - name: entryReferenceFrom
          in: query
          description: 'This data attribute is indicating that the AISP is in favour to get all transactions after  the transaction with identification entryReferenceFrom alternatively to the above defined period. This is a implementation of a delta access. If this data element is contained, the entries ''dateFrom'' and ''dateTo'' might be ignored by the ASPSP  if a delta report is supported. Optional if supported by API provider.'
          schema:
            type: string
        - name: deltaList
          in: query
          description: This data attribute is indicating that the AISP is in favour to get all transactions after the last report access for this PSU on the addressed account. This is another implementation of a delta access-report. This delta indicator might be rejected by the ASPSP if this function is not supported. Optional if supported by API provider
          schema:
            type: boolean
        - name: withBalance
          in: query
          description: 'If contained, this function reads the list of accessible payment accounts including the booking balance,  if granted by the PSU in the related consent and available by the ASPSP.  This parameter might be ignored by the ASPSP.'
          schema:
            type: boolean
        - name: state
          in: query
          description: ''
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionListResponse'
              examples:
                getTransactionListResponseExample1:
                  summary: Example of transactions by account without balances
                  value: {"account":{"iban":"GE02AL0000000000118020"},"transactions":{"booked":[{"transactionId":"GE02AL0000000000118020_1","bookingDate":"2020-10-29","valueDate":"2020-10-30","transactionAmount":{"currency":"GEL","amount":"-577.60"}},{"transactionId":"GE02AL0000000000118020_2","bookingDate":"2020-11-29","valueDate":"2020-11-30","transactionAmount":{"currency":"GEL","amount":"-7077.00"}},{"transactionId":"GE02AL0000000000118020_3","bookingDate":"2020-09-29","valueDate":"2020-09-30","transactionAmount":{"currency":"GEL","amount":"5277.55"}}],"pending":[{"transactionId":"GE02AL0000000000118020_1","bookingDate":"2020-10-29","valueDate":"2020-10-30","transactionAmount":{"currency":"GEL","amount":"577.00"}},{"transactionId":"GE02AL0000000000118020_2","bookingDate":"2020-11-29","valueDate":"2020-11-30","transactionAmount":{"currency":"GEL","amount":"-45277.00"}}],"_links":{"account":{"href":"v1/accounts/7b505906-074e-4e87-abd4-6424b4f621c0"},"first":{"href":"v1/accounts/7b505906-074e-4e87-abd4-6424b4f621c0/transactions?state=eyJBY2NvdW50UmVmZXJlbmNlSWQiOiI3YjUwNTkwNi0wNzRlLTRlODctYWJkNC02NDI0YjRmNjIxYzAiLCJTdGFydFRyYW5zYWN0aW9uUG9pbnRlciI6bnVsbCwiQm9va2luZ1N0YXR1cyI6MSwiRGF0ZUZyb20iOnt9LCJEYXRlVG8iOnt9LCJEZWx0YUxpc3QiOm51bGwsIldpdGhCYWxhbmNlIjp0cnVlfQ"},"next":{"href":"v1/accounts/7b505906-074e-4e87-abd4-6424b4f621c0/transactions?state=eyJBY2NvdW50UmVmZXJlbmNlSWQiOiI3YjUwNTkwNi0wNzRlLTRlODctYWJkNC02NDI0YjRmNjIxYzAiLCJTdGFydFRyYW5zYWN0aW9uUG9pbnRlciI6bnVsbCwiQm9va2luZ1N0YXR1cyI6MSwiRGF0ZUZyb20iOnt9LCJEYXRlVG8iOnt9LCJEZWx0YUxpc3QiOm51bGwsIldpdGhCYWxhbmNlIjp0cnVlfQreertty"},"last":{"href":"v1/accounts/7b505906-074e-4e87-abd4-6424b4f621c0/transactions?state=eyJBY2NvdW50UmVmZXJlbmNlSWQiOiI3YjUwNTkwNi0wNzRlLTRlODctYWJkNC02NDI0YjRmNjIxYzAiLCJTdGFydFRyYW5zYWN0aW9uUG9pbnRlciI6bnVsbCwiQm9va2luZ1N0YXR1cyI6MSwiRGF0ZUZyb20iOnt9LCJEYXRlVG8iOnt9LCJEZWx0YUxpc3QiOm51bGwsIldpdGhCYWxhbmNlIjp0cnVlfQqwwweeer"}}},"_links":{"download":{"href":"v1/accounts/7b505906-074e-4e87-abd4
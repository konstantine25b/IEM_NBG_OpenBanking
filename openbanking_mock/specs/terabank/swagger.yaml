openapi: 3.0.1
info:
  title: NextGenPSD2 XS2A Framework
  description: "\r\n# Summary\r\n\r\nThe **NextGenPSD2** Framework Version 1.3.9 offers a modern, open, harmonized and interoperable set of Application Programming Interfaces (APIs) as the safest and most efficient way to provide data securely. The NextGenPSD2 Framework reduces XS2A complexity and costs, addresses the problem of multiple competing standards in Europe and, aligned with the goals of the Euro Retail Payments Board, enables european banking customers to benefit from innovative products and services('Banking as a Service') by granting TPPs safe and secure (authenticated and authorized) access to their bank accounts and financial data.\r\n\r\nThe possible Approaches are:\r\n* Redirect SCA Approach\r\n* OAuth SCA Approach\r\n* Decoupled SCA Approach\r\n* Embedded SCA Approach without SCA method\r\n* Embedded SCA Approach with only one SCA method available\r\n* Embedded SCA Approach with Selection of a SCA method\r\n\r\nNot every message defined in this API definition is necessary for all approaches.\r\nFurthermore this API definition does not differ between methods which are mandatory, conditional, or optional.Therefore for a particular implementation of a Berlin Group PSD2 compliant API it is only necessary to support a certain subset of the methods defined in this API definition.\r\n\r\n**Please have a look at the implementation guidelines if you are not sure      which message has to be used for the approach you are going to use.**\r\n\r\n## Some General Remarks Related to this version of the OpenAPI Specification:\r\n\r\n* **This API definition is based on the Implementation Guidelines of the Berlin Group PSD2 API.**  It is not a replacement in any sense. The main specification is (at the moment) always the Implementation Guidelines of the Berlin Group PSD2 API\r\n"
  contact:
    name: Alta Software llc
    url: https://psd2.altasoft.ge
    email: psd2@altasoft.ge
  version: v0.8
servers:
  - url: psd2-sandbox1.altasoft.ge
    description: Sandbox Server 1
  - url: psd2-sandbox2.altasoft2.ge
    description: Sandbox Server 2
paths:
  /0.8/v1/accounts:
    get:
      tags:
        - Accounts
      summary: Read account list
      description: 'Read the identifiers of the available payment account together with  booking balance information, depending on the consent granted.  It is assumed that a consent of the PSU to this access is already given and stored on the ASPSP system.  The addressed list of accounts depends then on the PSU ID and the stored consent addressed by consentId,  respectively the OAuth2 access token.   Returns all identifiers of the accounts, to which an account access has been granted to through  the /consents endpoint by the PSU.  In addition, relevant information about the accounts and hyperlinks to corresponding account  information resources are provided if a related consent has been already granted.  Remark: Note that the /consents endpoint optionally offers to grant an access on all available  payment accounts of a PSU.  In this case, this endpoint will deliver the information about all available payment accounts  of the PSU at this ASPSP.'
      parameters:
        - name: Consent-ID
          in: header
          description: 'ConsentId of the related AIS consent, which was performed prior to this payment initiation.'
          required: true
          schema:
            maxLength: 36
            minLength: 0
            type: string
        - name: withBalance
          in: query
          description: 'If contained, this function reads the list of accessible payment accounts including the booking balance,  if granted by the PSU in the related consent and available by the ASPSP.  This parameter might be ignored by the ASPSP.'
          schema:
            type: boolean

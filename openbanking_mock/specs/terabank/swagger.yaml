    ScaStatus:
      enum:
        - received
        - psuIdentified
        - psuAuthenticated
        - scaMethodSelected
        - started
        - unconfirmed
        - finalised
        - failed
        - exempted
      type: string
      description: "This data element is containing information about the status of the SCA method applied. The following codes are defined for this data type.\r\n* 'received': An authorisation or cancellation-authorisation resource has been created successfully.\r\n* 'psuIdentified': The PSU related to the authorisation or cancellation-authorisation resource has been identified.\r\n* 'psuAuthenticated': The PSU related to the authorisation or cancellation-authorisation resource has been identified and authenticated e.g. by a password or by an access token.\r\n* 'scaMethodSelected': The PSU/TPP has selected the related SCA routine. If the SCA method is chosen implicitly since only one SCA method is available, then this is the first status to be reported instead of 'received'.\r\n* 'unconfirmed': SCA is technically successfully finalised by the PSU, but the authorisation resource needs a confirmation command by the TPP yet.\r\n* 'started': The addressed SCA routine has been started.\r\n* 'finalised': The SCA routine has been finalised successfully (including a potential confirmation command). This is a final status of the authorisation resource.\r\n* 'failed': The SCA routine failed. This is a final status of the authorisation resource.\r\n* 'exempted': SCA was exempted for the related transaction, the related authorisation is successful. This is a final status of the authorisation resource."
    ScaStatusAuthorisationConfirmation:
      enum:
        - finalised
        - failed
      type: string
      description: 'This data element is containing information about the status of the SCA method in an authorisation confirmation response.   The following codes are defined for this data type.    * ''finalised'': if the transaction authorisation and confirmation was successfule.   * ''failed'': if the transaction authorisation or confirmation was not successful.'

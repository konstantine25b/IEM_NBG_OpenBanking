          type: string
          description: Debtor Name
          nullable: true
        debtorAccount:
          $ref: '#/components/schemas/AccountReference'
        debtorAgent:
          pattern: '[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}'
          type: string
          description: BIC
          nullable: true
        ultimateDebtor:
          maxLength: 70
          minLength: 0
          type: string
          description: Ultimate Debtor
          nullable: true
        remittanceInformationUnstructured:
          maxLength: 140
          minLength: 0
          type: string
          description: "Unstructured remittance information.\r\nდანიშნულება"
          nullable: true
        remittanceInformationUnstructuredArray:
          type: array

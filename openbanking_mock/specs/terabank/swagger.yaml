    delete:
      tags:
        - SinglePayments
      summary: Payment cancellation request
      description: "This method initiates the cancellation of a payment.  Depending on the payment-service, the payment-product and the ASPSP's\r\n            implementation,  this TPP call might be sufficient to cancel a payment.  If an authorisation of the payment cancellation is mandated by the\r\n            ASPSP,  a corresponding hyperlink will be contained in the response message.  Cancels the addressed payment with resource identification\r\n            paymentId if applicable to the payment-service, payment-product and received in product related timelines\r\n            (e.g. before end of business day for scheduled payments of the last business day before the scheduled execution day).\r\n            The response to this DELETE command will tell the TPP whether the\r\n            * access method was rejected,\r\n            * access method was successful, or\r\n            * access method is generally applicable, but further authorisation processes are needed."

    UpdatePsuAuthenticationResponse:
      type: object
      properties:
        transactionFees:
          $ref: '#/components/schemas/Amount'
        currencyConversionFees:
          $ref: '#/components/schemas/Amount'
        estimatedTotalAmount:
          $ref: '#/components/schemas/Amount'
        estimatedInterbankSettlementAmount:
          $ref: '#/components/schemas/Amount'
        chosenScaMethod:
          $ref: '#/components/schemas/AuthenticationObject'
        challengeData:
          $ref: '#/components/schemas/ChallengeData'
        scaMethods:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationObject'
          description: "This data element might be contained, if SCA is required and if the PSU has a choice between different authentication methods.\r\nDepending on the risk management of the ASPSP this choice might be offered before or after the PSU has been identified with the first relevant factor, or if an access token is transported.\r\nIf this data element is contained, then there is also a hyperlink of type 'startAuthorisationWithAuthenticationMethodSelection' contained in the response body.\r\nThese methods shall be presented towards the PSU for selection by the TPP."
          nullable: true
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HrefType'
          description: "A list of hyperlinks to be recognised by the TPP. Might be contained, if several authentication methods are available for the PSU. Type of links admitted in this response:\r\n* 'updateAdditionalPsuAuthentication': The link to the payment initiation or account information resource, which needs to be updated by an additional PSU password.\r\nThis link is only contained in rare cases, where such additional passwords are needed for PSU authentications.\r\n* 'updateAdditionalEncryptedPsuAuthentication': The link to the payment initiation or account information resource, which needs to be updated by an additional encrypted PSU password.\r\nThis link is only contained in rare cases, where such additional passwords are needed for PSU authentications.\r\n* selectAuthenticationMethod: This is a link to a resource, where the TPP can select the applicable second factor authentication methods for the PSU,\r\nif there were several available authentication methods. This link is only contained, if the PSU is already identified or authenticated with the first\r\nrelevant factor or alternatively an access token, if SCA is required and if the PSU has a choice between different authentication methods.\r\nIf this link is contained, then there is also the data element 'scaMethods' contained in the response body.\r\n* 'authoriseTransaction': The link to the resource, where the \"Transaction authorisation request\" is sent to.\r\nThis is the link to the resource which will authorise the transaction by checking the SCA authentication data within the Embedded SCA approach.\r\n* 'scaStatus': The link to retrieve the scaStatus of the corresponding authorisation sub-resource."
          nullable: true
        scaStatus:
          $ref: '#/components/schemas/ScaStatus'
        psuMessage:
          maxLength: 500
          minLength: 0
          type: string
          description: Text to be displayed to the PSU
          nullable: true
        authorisationId:
          type: string
          description: Resource identification of the related SCA
          nullable: true
      additionalProperties: false
      description: Psu Authentication Update Response

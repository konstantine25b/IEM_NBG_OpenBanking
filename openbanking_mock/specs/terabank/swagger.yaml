  /0.8/v1/consents:
    post:
      tags:
        - Consents
      summary: Create consent
      description: "<br>\r\n            This method create a consent resource, defining access rights to dedicated accounts of a\r\n            given PSU-ID. These accounts are addressed explicitly in the method as parameters as a\r\n            core function.\r\n            \r\n<br>\r\n            **Side Effects** When this consent request is a request where the 'recurringIndicator'\r\n            equals 'true', and if it exists already a former consent for recurring access on account\r\n            information for the addressed PSU, then the former consent automatically expires as soon\r\n            as the new consent request is authorised by the PSU. Optional Extension: As an option,\r\n            an ASPSP might optionally accept a specific access right on the access on all PSD2\r\n            related services for all available accounts. As another option an ASPSP might optionally\r\n            also accept a command, where only access rights are inserted without mentioning the\r\n            addressed account. The relation to accounts is then handled afterwards between PSU and\r\n            ASPSP. This option is not supported for the Embedded SCA Approach. As a last option, an\r\n            ASPSP might in addition accept a command with access rights\r\n            * to see the list of available payment accounts or\r\n            * to see the list of available payment accounts with balances.\r\n            "
      requestBody:
        description: Request body for a consents request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentRequestBody'
            examples:
              createConsentExample1:
                summary: Consent request on account list of available accounts.
                value: {"access":{"availableAccounts":"allAccounts"},"recurringIndicator":false,"validUntil":"2021-02-28","frequencyPerDay":4,"combinedServiceIndicator":false}
              createConsentExample2:
                summary: Consent request on account list without indication of accounts.
                value: {"access":{"balances":[],"transactions":[]},"recurringIndicator":false,"validUntil":"2021-02-28","frequencyPerDay":4,"combinedServiceIndicator":false}
              createConsentExample3:
                summary: Consent request on account list with dedicated accounts.
                value: {"access":{"accounts":[{"iban":"GE02AL0000000000118020","currency":"GEL"},{"iban":"GE02AL0000000000309110","currency":"USD"},{"iban":"GE02AL0000000001618610","currency":"EUR"}],"balances":[{"iban":"GE02AL0000000000118020","currency":"GEL"},{"iban":"GE02AL0000000000309110","currency":"USD"},{"iban":"GE02AL0000000001618610","currency":"EUR"},{"iban":"GE02AL0000000001718520","currency":"GEL"}],"transactions":[{"iban":"GE02AL0000000001718520","currency":"GEL"},{"maskedPan":"123456******1234"}]},"recurringIndicator":false,"validUntil":"2021-02-28","frequencyPerDay":4,"combinedServiceIndicator":false}
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateConsentRequestBody'
            examples:
              createConsentExample1:
                summary: Consent request on account list of available accounts.
                value: {"access":{"availableAccounts":"allAccounts"},"recurringIndicator":false,"validUntil":"2021-02-28","frequencyPerDay":4,"combinedServiceIndicator":false}
              createConsentExample2:
                summary: Consent request on account list without indication of accounts.
                value: {"access":{"balances":[],"transactions":[]},"recurringIndicator":false,"validUntil":"2021-02-28","frequencyPerDay":4,"combinedServiceIndicator":false}
              createConsentExample3:
                summary: Consent request on account list with dedicated accounts.
                value: {"access":{"accounts":[{"iban":"GE02AL0000000000118020","currency":"GEL"},{"iban":"GE02AL0000000000309110","currency":"USD"},{"iban":"GE02AL0000000001618610","currency":"EUR"}],"balances":[{"iban":"GE02AL0000000000118020","currency":"GEL"},{"iban":"GE02AL0000000000309110","currency":"USD"},{"iban":"GE02AL0000000001618610","currency":"EUR"},{"iban":"GE02AL0000000001718520","currency":"GEL"}],"transactions":[{"iban":"GE02AL0000000001718520","currency":"GEL"},{"maskedPan":"123456******1234"}]},"recurringIndicator":false,"validUntil":"2021-02-28","frequencyPerDay":4,"combinedServiceIndicator":false}
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConsentResponse'
              examples:
                createConsentResponseExample1:
                  summary: Redirect with Oauth2 (Start authorization)
                  value: {"consentStatus":"received","consentId":"beae3ef6-e219-4626-a037-af10cd937df5","_links":{"self":{"href":"0.8/v1/consents/beae3ef6-e219-4626-a037-af10cd937df5"},"status":{"href":"0.8/v1/consents/beae3ef6-e219-4626-a037-af10cd937df5/status"},"startAuthorisation":{"href":"0.8/v1/consents/beae3ef6-e219-4626-a037-af10cd937df5/authorisations"}}}
                createConsentResponseExample2:
                  summary: Redirect with Oauth2 (Start authentication)
                  value: {"consentStatus":"valid","consentId":"beae3ef6-e219-4626-a037-af10cd937df5","_links":{"self":{"href":"0.8/v1/consents/beae3ef6-e219-4626-a037-af10cd937df5"},"status":{"href":"0.8/v1/consents/beae3ef6-e219-4626-a037-af10cd937df5/status"},"scaOAuth":{"href":"https://oauth2.psd2.altasoft.ge/.well-known/oauth-authorization-server"}}}

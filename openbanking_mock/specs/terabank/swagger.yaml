  '/0.8/v1/consents/{consentId}/authorisations':
    post:
      tags:
        - Consents
      summary: Start the authorisation process for a consent
      description: "Create an authorisation sub-resource and start the authorisation process of a consent.\r\nThe message might in addition transmit authentication and authorisation related data.\r\nThis method is iterated n times for a n times SCA authorisation in a corporate context,\r\neach creating an own authorisation sub-endpoint for the corresponding PSU authorising\r\nthe consent. The ASPSP might make the usage of this access method unnecessary, since the\r\nrelated authorisation resource will be automatically created by the ASPSP after the\r\nsubmission of the consent data with the first POST consents call. The start\r\nauthorisation process is a process which is needed for creating a new authorisation or\r\ncancellation sub-resource. This applies in the following scenarios:\r\n* The ASPSP has indicated with an 'startAuthorisation' hyperlink in the preceding Payment\r\ninitiation response that an explicit start of the authorisation process is needed by the\r\nTPP. The 'startAuthorisation' hyperlink can transport more information about data which\r\nneeds to be uploaded by using the extended forms:\r\n* 'startAuthorisationWithPsuIdentfication',\r\n* 'startAuthorisationWithPsuAuthentication'\r\n* 'startAuthorisationWithEncryptedPsuAuthentication'\r\n* 'startAuthorisationWithAuthentciationMethodSelection'\r\n* The related payment initiation cannot yet be executed since a multilevel SCA is mandated.\r\n* The ASPSP has indicated with an 'startAuthorisation' hyperlink in the preceding\r\npayment cancellation response that an explicit start of the authorisation process is\r\nneeded by the TPP. The 'startAuthorisation' hyperlink can transport more information\r\nabout data which needs to be uploaded by using the extended forms as indicated above.\r\n* The related payment cancellation request cannot be applied yet since a multilevel SCA\r\nis mandate for executing the cancellation. * The signing basket needs to be authorised yet."
      parameters:
        - name: consentId
          in: path
          description: ID of the corresponding consent object as returned by an account information consent request.
          required: true
          schema:
            maxLength: 36
            minLength: 0
            type: string
          example: beae3ef6-e219-4626-a037-af10cd937df5
      requestBody:
        description: Request body for start consent authorization request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConsentAuthorizationRequestBody'
            examples:
              startAuthorizationRequestExample1:
                summary: Start the authorization process for a consent.
                value: 

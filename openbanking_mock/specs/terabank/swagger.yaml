    StandingOrderDetails:
      type: object
      properties:
        startDate:
          type: string
          description: The first applicable day of execution starting from this date is the first payment
          format: date
        frequency:
          $ref: '#/components/schemas/FrequencyCode'
        endDate:
          type: string
          description: 'The last applicable day of execution. If not given, it is an infinite standing order.'
          format: date
          nullable: true
        executionRule:
          $ref: '#/components/schemas/ExecutionRule'
        withinAMonthFlag:
          type: boolean
          description: "This element is only used in case of frequency equals 'Monthly'.\r\nIf this element equals false it has no effect.\r\nIf this element equals true, then the execution rule is overruled if the day of execution would fall into a different month using the execution rule.\r\nExample: executionRule equals 'preceding', dayOfExecution equals '02' and the second of a month is a Sunday.\r\nIn this case, the transaction date would be on the last day of the month before.\r\nThis would be overruled if withinAMonthFlag equals true and the payment is processed on Monday the third of the Month.\r\nRemark: This attribute is rarely supported in the market."
          nullable: true
        monthsOfExecution:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/MonthOfExecution'
          description: "The format is following the regular expression \\d{1,2}.\r\nThe array is restricted to 11 entries.\r\nThe values contained in the array entries shall all be different and the maximum value of one entry is 12.\r\nThis attribute is contained if and only if the frequency equals \"MonthlyVariable\".\r\nExample: An execution on January, April and October each year is addressed by [\"1\", \"4\", \"10\"]."
          nullable: true
        multiplicator:
          type: integer
          description: "This is multiplying the given frequency resulting the exact frequency, e.g. Frequency=\r\nweekly and multiplicator 3 means every 3 weeks.\r\nRemark: This attribute is rarely supported in the market."
          format: int32
          nullable: true
        dayOfExecution:
          $ref: '#/components/schemas/DayOfExecution'
        limitAmount:
          $ref: '#/components/schemas/Amount'
      additionalProperties: false
      description: Details of underlying standing orders.
    StartConsentAuthorisationResponse:
      type: object
      properties:
        scaStatus:
          $ref: '#/components/schemas/ScaStatus'
        authorisationId:
          type: string
          description: Resource identification of the related SCA.
          nullable: true
        scaMethods:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationObject'
          description: "This data element might be contained, if SCA is required and if the PSU has a choice between different authentication methods.\r\nDepending on the risk management of the ASPSP this choice might be offered before or after the PSU has been identified\r\nwith the first relevant factor, or if an access token is transported.\r\nIf this data element is contained, then there is also a hyperlink of type 'startAuthorisationWithAuthenticationMethodSelection' contained in the response body.\r\nThese methods shall be presented towards the PSU for selection by the TPP."
          nullable: true
        chosenScaMethod:
          $ref: '#/components/schemas/AuthenticationObject'
        challengeData:
          $ref: '#/components/schemas/ChallengeData'
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HrefType'
          description: "A list of hyperlinks to be recognised by the TPP. The actual hyperlinks used in the response depend on the dynamical decisions of the ASPSP when processing the request.\r\n Remark: All links can be relative or full links, to be decided by the ASPSP.\r\n  Type of links admitted in this response, (further links might be added for ASPSP defined extensions):\r\n'scaRedirect': In case of an SCA Redirect Approach, the ASPSP is transmitting the link to which to redirect the PSU browser.\r\n'scaOAuth': In case of a SCA OAuth2 Approach, the ASPSP is transmitting the URI where the configuration of the Authorisation Server can be retrieved.The configuration follows the OAuth 2.0 Authorisation Server Metadata specification.\r\n'confirmation': Might be added by the ASPSP if either the \"scaRedirect\" or \"scaOAuth\" hyperlink is returned in the same response message. This hyperlink defines the URL to the resource which needs to be updated with\r\n    a confirmation code as retrieved after the plain redirect authentication process with the ASPSP authentication server or\r\n   an access token as retrieved by submitting an authorization code after the integrated OAuth based authentication process with the ASPSP authentication server.\r\n'updatePsuIdentification': The link to the authorisation or cancellation authorisation sub-resource, where PSU identification data needs to be uploaded.\r\n'startAuthorisationWithPsuAuthentication': The link to the authorisation or cancellation authorisation sub-resource, where PSU authentication data needs to be uploaded.\r\n'startAuthorisationWithEncryptedPsuAuthentication': Same as startAuthorisationWithPsuAuthentication where the authentication data need to be encrypted on application layer in uploading.\r\n'selectAuthenticationMethod': The link to the authorisation or cancellation authorisation sub-resource, where the selected authentication method needs to be uploaded.This link is contained under exactly the same conditions as the data element 'scaMethods'.\r\n'authoriseTransaction': The link to the authorisation or cancellation authorisation sub-resource, where the authorisation data has to be uploaded, e.g.the TOP received by SMS.\r\n'scaStatus': The link to retrieve the scaStatus of the corresponding authorisation sub-resource."
          nullable: true
        psuMessage:
          maxLength: 500
          minLength: 0
          type: string
          description: Text to be displayed to the PSU
          nullable: true
      additionalProperties: false
      description: Body of the JSON response for a Start SCA authorisation request.
    StartConsentAuthorizationRequestBody:
      type: object
      properties:
        updatePsuAuthentication:
          $ref: '#/components/schemas/UpdatePsuAuthentication'
        selectPsuAuthenticationMethod:
          $ref: '#/components/schemas/SelectPsuAuthenticationMethod'
        transactionAuthorisation:
          $ref: '#/components/schemas/TransactionAuthorization'
      additionalProperties: { }
      description: Content of the body of a Select PSU authentication method request
    TppMessage:

  '/0.8/v1/bulk-payments/{payment-product}/{paymentId}/authorisations':
    post:
      tags:
        - BulkPayments
      summary: Start the authorisation process for a payment initiation
      description: 'Create an authorisation sub-resource and start the authorisation process.  The message might in addition transmit authentication and authorisation related data.   This method is iterated n times for a n times SCA authorisation in a  corporate context, each creating an own authorisation sub-endpoint for  the corresponding PSU authorising the transaction.  The ASPSP might make the usage of this access method unnecessary in case  of only one SCA process needed, since the related authorisation resource  might be automatically created by the ASPSP after the submission of the  payment data with the first POST payments/{payment-product} call.  The start authorisation process is a process which is needed for creating a new authorisation  or cancellation sub-resource.   This applies in the following scenarios:    * The ASPSP has indicated with a ''startAuthorisation'' hyperlink in the preceding Payment      initiation response that an explicit start of the authorisation process is needed by the TPP.      The ''startAuthorisation'' hyperlink can transport more information about data which needs to be      uploaded by using the extended forms:     * ''startAuthorisationWithPsuIdentfication''     * ''startAuthorisationWithPsuAuthentication''     * ''startAuthorisationWithEncryptedPsuAuthentication''     * ''startAuthorisationWithAuthentciationMethodSelection''   * The related payment initiation cannot yet be executed since a multilevel SCA is mandated.   * The ASPSP has indicated with a ''startAuthorisation'' hyperlink in the preceding      Payment cancellation response that an explicit start of the authorisation process is needed by the TPP.      The ''startAuthorisation'' hyperlink can transport more information about data which needs to be uploaded      by using the extended forms as indicated above.   * The related payment cancellation request cannot be applied yet since a multilevel SCA is mandate for      executing the cancellation.   * The signing basket needs to be authorised yet.'
      parameters:
        - name: payment-product
          in: path
          description: 'The addressed payment product endpoint, e.g. for SEPA Credit Transfers (SCT). The ASPSP will publish which of the payment products/endpoints will be supported.  The following payment products are supported:   - sepa-credit-transfers   - instant-sepa-credit-transfers   - target-2-payments   - cross-border-credit-transfers   - pain.001-sepa-credit-transfers   - pain.001-instant-sepa-credit-transfers   - pain.001-target-2-payments   - pain.001-cross-border-credit-transfers  **Remark:** For all SEPA Credit Transfer based endpoints which accept XML encoding,  the XML pain.001 schemes provided by EPC are supported by the ASPSP as a minimum for the body content.  Further XML schemes might be supported by some communities.  **Remark:** For cross-border and TARGET-2 payments only community wide pain.001 schemes do exist.  There are plenty of country specificic scheme variants.'
          required: true
          schema:
            $ref: '#/components/schemas/PaymentProductType'
        - name: paymentId
          in: path
          description: Resource identification of the generated payment initiation resource.
          required: true
          schema:
            type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConsentAuthorizationRequestBody'
            examples:
              startAuthorizationRequestExample1:
                summary: Start the authorization process for a consent.
                value: 
          application/*+json:
            schema:
              $ref: '#/components/schemas/StartConsentAuthorizationRequestBody'
            examples:
              startAuthorizationRequestExample1:
                summary: Start the authorization process for a consent.
                value: 

      description: "This method updates PSU data on the consents resource if needed. It may authorise a\r\nconsent within the Embedded SCA Approach where needed. Independently from the SCA\r\nApproach it supports e.g. the selection of the authentication method and a non-SCA PSU\r\nauthentication. This methods updates PSU data on the cancellation authorisation resource\r\nif needed. There are several possible update PSU data requests in the context of a\r\nconsent request if needed, which depends on the SCA approach:\r\n* Redirect SCA Approach: A specific Update PSU data request is applicable for\r\n* the selection of authentication methods, before choosing the actual SCA approach.\r\n* Decoupled SCA Approach: A specific update PSU data request is only applicable for\r\n* adding the PSU Identification, if not provided yet in the payment initiation request\r\nor the Account Information Consent Request, or if no OAuth2 access token is used, or\r\n* the selection of authentication methods.\r\n* Embedded SCA Approach: The Update PSU data request might be used\r\n* to add credentials as a first factor authentication data of the PSU and\r\n* to select the authentication method and * transaction authorisation. The SCA Approach\r\nmight depend on the chosen SCA method. For that reason, the following possible update\r\nPSU data request can apply to all SCA approaches:\r\n* Select an SCA method in case of several SCA methods are available for the customer.\r\nThere are the following request types on this access path: * Update PSU identification *\r\nUpdate PSU authentication * Select PSU autorization method WARNING: This method needs a\r\nreduced header, therefore many optional elements are not present. Maybe in a later\r\nversion the access path will change. * Transaction Authorisation WARNING: This method\r\nneeds a reduced header, therefore many optional elements are not present. Maybe in a\r\nlater version the access path will change."
      parameters:

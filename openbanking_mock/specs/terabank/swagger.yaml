components:
  schemas:
    AccountAccess:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountReference'
          description: "Is asking for detailed account information. If the array is empty in a request, the TPP is asking for an accessible account list.\r\nThis may be restricted in a PSU/ASPSP authorization dialogue.\r\nIf the array is empty, also the arrays for balances, additionalInformation sub attributes or transactions shall be empty, if used."
          nullable: true
        balances:
          type: array
          items:
            $ref: '#/components/schemas/AccountReference'
          description: "Is asking for balances of the addressed accounts.\r\nIf the array is empty in the request, the TPP is asking for the balances of all accessible account lists.\r\nThis may be restricted in a PSU/ASPSP authorization dialogue.\r\nIf the array is empty, also the arrays for accounts, additionalInformation sub attributes or transactions shall be empty, if used."
          nullable: true
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/AccountReference'
          description: "Is asking for transactions of the addressed accounts.\r\nIf the array is empty in the request, the TPP is asking for the transactions of all accessible account lists.\r\nThis may be restricted in a PSU/ASPSP authorization dialogue.\r\nIf the array is empty, also the arrays for accounts, additionalInformation sub attributes or balances shall be empty, if used."
          nullable: true
        additionalInformation:
          $ref: '#/components/schemas/AdditionalInformationAccess'
        availableAccounts:
          $ref: '#/components/schemas/AvailableAccounts'
        availableAccountsWithBalance:
          $ref: '#/components/schemas/AvailableAccounts'
        allPsd2:
          $ref: '#/components/schemas/AvailableAccounts'
        restrictedTo:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCashAccountType1Code'
          description: "<br>\r\n            If the TPP requests access to accounts via availableAccounts(List of available accounts), global or bank driven consents, the TPP may include this element to restrict access to the referred account types.\r\n            Absence of the element is interpreted as \"no restriction\" (therefore access to accounts of all types is requested).\r\n            The element may only occur, if each of the elements\r\n            - accounts\r\n            - balances\r\n            - transactions\r\n            is either not present or contains an empty array.\r\n            \r\n<br>\r\n            (13)-ის თანახმად, აღნიშნული ატრიბუტის მხარდაჭერა შესაძლოა შეწყდეს XS2A-ს შემდეგ ვერსიებში.\r\n            ამდენად, მისი გამოყენება არარეკომენდებულია.\r\n            თუ ატრიბუტი მხარდაჭერილი არ არის, აუცილებელია ამსმპ-მა იმოქმედოს ისე,  თითქოს იგი საერთოდ არ მოსულა დოკუმენტში.\r\n            "
          nullable: true
      additionalProperties: { }
      description: Requested access services for a consent.
    AccountDetails:
      type: object
      properties:
        resourceId:
          type: string
          description: 'This shall be filled, if addressable resource are created by the ASPSP on the /accounts or /card-accounts endpoint.'
          nullable: true
        iban:
          pattern: '[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}'
          type: string
          description: IBAN of an account
          nullable: true
        msisdn:
          maxLength: 35
          minLength: 0
          type: string
          description: Mobile phone number.
          nullable: true
        currency:
          pattern: '[A-Z]{3}'
          type: string
          description: ISO 4217 Alpha 3 currency code.
          nullable: true
        name:
          maxLength: 70
          minLength: 0
          type: string
          description: 'Name of the account, as assigned by the ASPSP, in agreement with the account owner in order to provide an additional means of identification of the account.'
          nullable: true
        displayName:
          maxLength: 70
          minLength: 0
          type: string
          description: Name of the account as defined by the PSU within online channels.
          nullable: true
        product:
          maxLength: 35
          minLength: 0
          type: string
          description: 'Product name of the bank for this account, proprietary definition.'
          nullable: true
        cashAccountType:
          $ref: '#/components/schemas/ExternalCashAccountType1Code'
        status:
          $ref: '#/components/schemas/AccountStatus'
        bic:
          pattern: '[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}'
          type: string
          description: Bank Identification Code (BIC)
          nullable: true
        linkedAccounts:
          maxLength: 70
          minLength: 0
          type: string
          description: 'In case of a set of pending card transactions, the ASPSP will provide the relevant cash account the card is set up on.'
          nullable: true
        usage:
          $ref: '#/components/schemas/AccountUsage'
        details:
          maxLength: 500
          minLength: 0
          type: string
          description: "Specifications that might be provided by the ASPSP:\r\n    - characteristics of the account\r\n    - characteristics of the relevant card"
          nullable: true
        balances:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
          description: 'A list of balances regarding this account, e.g. the current balance, the last booked balance. The list might be restricted to the current balance.'
          nullable: true
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HrefType'
          description: Gets or Sets Links
          nullable: true
        owner:
          maxLength: 140
          minLength: 0
          type: string
          description: "<br>Name of the legal account owner. If there is more than one owner, then e.g. two names might be noted here.\r\n<br>\r\n            For a corporate account, the corporate name is used for this attribute. Even if supported by the ASPSP,\r\n            the provision of this field might depend on the fact whether an explicit consent to this specific\r\n            additional account information has been given by the PSU.\r\n            "
          nullable: true
        partyIdentification:
          $ref: '#/components/schemas/PartyIdentification'
      additionalProperties: false
      description: "The ASPSP shall give at least one of the account reference identifiers:\r\n- iban\r\n- bban\r\n- pan\r\n- maskedPan\r\n- msisdn\r\nIf the account is a multicurrency account currency code in 'currency' is set to 'XXX'."
    AccountReference:
      type: object
      properties:
        iban:
          pattern: '[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}'
          type: string
          nullable: true
        bban:
          pattern: '[a-zA-Z0-9]{1,30}'
          type: string
          nullable: true
        pan:
          maxLength: 35
          minLength: 0
          type: string
          nullable: true
        maskedPan:
          maxLength: 35
          minLength: 0
          type: string
          nullable: true
        msisdn:
          maxLength: 35
          minLength: 0
          type: string
          nullable: true
        currency:
          pattern: '[A-Z]{3}'
          type: string
          nullable: true
        cashAccountType:
          $ref: '#/components/schemas/ExternalCashAccountType1Code'
        other:
          $ref: '#/components/schemas/OtherIdentification'
        name:
          maxLength: 70
          minLength: 0
          type: string
          nullable: true
      additionalProperties: { }
    AccountReport:
      type: object
      properties:
        booked:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDetails'
          description: Shall be contained if bookingStatus parameter is set to "booked" or "both"
          nullable: true
        pending:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDetails'
          description: Is not contained if the bookingStatus parameter is set to "booked" or "information".
          nullable: true
        information:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDetails'
          description: Only contained if the bookingStatus is set to "information" and if supported by ASPSP.
          nullable: true
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HrefType'
          description: "The following links might be used within this context:\r\n* account (mandatory) '\r\n* first (optional) '\r\n* next (optional) '\r\n* previous (optional) '\r\n* last (optional)"
          nullable: true
      additionalProperties: false
      description: "JSON based account report.\r\nThis account report contains transactions resulting from the query parameters.\r\n    * 'booked' shall be contained if bookingStatus parameter is set to 'booked' or 'both'.\r\n    * 'pending' is not contained if the bookingStatus parameter is set to \"booked\" or \"information\".\r\n    * 'information' Only contained if the bookingStatus is set to \"information\" and if supported by ASPSP."
    AccountStatus:
      enum:
        - enabled
        - deleted
        - blocked
      type: string
      description: "Account status. The value is one of the following:\r\n* enabled: account is available\r\n* deleted: account is terminated\r\n* blocked: account is blocked e.g. for legal reasons If this field is not used, than the account is available in the sense of this specification."
    AccountUsage:
      enum:
        - PRIV
        - ORGA
      type: string
      description: "Specifies the usage of the account:\r\n    * PRIV: private personal account\r\n    * ORGA: professional account"
    AdditionalInformationAccess:
      type: object
      properties:
        ownerName:
          type: array
          items:
            $ref: '#/components/schemas/AccountReference'
          description: "Is asking for account owner name of the accounts referenced within.\r\nIf the array is empty in the request, the TPP is asking for the account\r\nowner name of all accessible accounts.\r\nThis may be restricted in a PSU/ASPSP authorization dialogue.\r\nIf the array is empty, also the arrays for accounts, balances or transactions shall be empty, if used. The ASPSP will indicate in the consent resource after a successful authorisation,\r\nwhether the ownerName consent can be accepted by providing the accounts on which the ownerName will\r\nbe delivered.\r\nThis array can be empty."
          nullable: true
        trustedBeneficiaries:
          type: array
          items:
            $ref: '#/components/schemas/AccountReference'
          description: "Optional if supported by API provider. Is asking for the trusted beneficiaries related to the accounts referenced within and related to the PSU. If the array is empty in the request, the TPP is asking for the lists of trusted beneficiaries of all accessible accounts.\r\nThis may be restricted in a PSU/ASPSP authorization dialogue by the PSU if also the account lists addressed\r\nby the tags “accounts”, “balances” or “transactions” are empty. The ASPSP will indicate in the consent resource after a successful authorisation,\r\nwhether the trustedBeneficiaries consent can be accepted by providing the accounts on which the list of trusted beneficiaries will be delivered.\r\nThis array can be empty."
          nullable: true
      additionalProperties: { }
      description: "Optional if supported by API provider.\r\nIs asking for additional information as added within this structured object.\r\nThe usage of this data element requires at least one of the entries \\\"accounts\\\",  \\\"transactions\\\" or \\\"balances\\\" also to be contained in the object.\r\nIf detailed accounts are referenced, it is required in addition that any account addressed within\r\nthe additionalInformation attribute is also addressed by at least one of the attributes \\\"accounts\\\",  \\\"transactions\\\" or \\\"balances\\\"."
    AdditionalInformationStructured:
      required:
        - standingOrderDetails
      type: object
      properties:
        standingOrderDetails:
          $ref: '#/components/schemas/StandingOrderDetails'
      additionalProperties: false
      description: Is used if and only if the bookingStatus entry equals \"information\".  Every active standing order related to the dedicated payment account result into one entry.
    Address:
      required:
        - country
      type: object
      properties:
        streetName:
          maxLength: 70
          minLength: 0
          type: string
          nullable: true
        buildingNumber:
          type: string
          nullable: true
        townName:
          type: string
          nullable: true
        postCode:
          type: string
          nullable: true
        country:
          minLength: 1
          pattern: '[A-Z]{2}'
          type: string
      additionalProperties: { }
    Amount:
      required:
        - amount
        - currency
      type: object
      properties:
        currency:
          maxLength: 3
          minLength: 3
          pattern: '[A-Z]{3}'
          type: string
        amount:
          minLength: 1
          pattern: '-?[0-9]{1,14}(\.[0-9]{1,3})?'
          type: string
      additionalProperties: { }
    AuthenticationObject:
      required:
        - authenticationMethodId
        - authenticationType
        - name
      type: object
      properties:
        authenticationType:
          $ref: '#/components/schemas/AuthenticationType'
        authenticationVersion:
          type: string
          nullable: true
        authenticationMethodId:
          maxLength: 35
          minLength: 0
          type: string
        name:
          minLength: 1
          type: string
        explanation:
          type: string
          nullable: true
      additionalProperties: false
    AuthenticationType:
      enum:
        - SMS_OTP
        - CHIP_OTP
        - PHOTO_OTP
        - PUSH_OTP
        - SMTP_OTP
      type: string
    AuthorisationConfirmation:
      required:
        - confirmationCode
      type: object
      properties:
        confirmationCode:
          minLength: 1
          type: string
          description: Confirmation Code as retrieved by the TPP from the redirect based SCA process.
      additionalProperties: { }
      description: Content of the body of an authorisation confirmation request
    AuthorisationConfirmationResponse:
      type: object
      properties:
        scaStatus:
          $ref: '#/components/schemas/ScaStatusAuthorisationConfirmation'
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HrefType'
          description: A list of hyperlinks.
          nullable: true
        psuMessage:
          maxLength: 500
          minLength: 0
          type: string
          description: Text to be displayed to the PSU
          nullable: true
      additionalProperties: false
      description: Authorization Process Confirmation Response
    AuthorisationsResponse:
      required:
        - authorisationIds
      type: object
      properties:
        authorisationIds:
          type: array
          items:
            type: string
          description: Gets or Sets AuthorisationIds
      additionalProperties: false
      description: An array of all authorisationIds.
    AvailableAccounts:
      enum:
        - allAccounts
        - allAccountsWithOwnerName
      type: string
      description: "Optional if supported by API provider.\r\nThe values \"allAccounts\" and \"allAccountsWithOwnerName\" are admitted.\r\nThe support of the \"allAccountsWithOwnerName\" value by the ASPSP is optional."
    Balance:
      required:
        - balanceAmount
      type: object
      properties:
        balanceAmount:
          $ref: '#/components/schemas/Amount'
        balanceType:
          $ref: '#/components/schemas/BalanceType'
        creditLimitIncluded:
          type: boolean
          description: 'A flag indicating if the credit limit of the corresponding account is included in the calculation of the balance, where applicable.'
          nullable: true
        lastChangeDateTime:
          type: string
          description: 'This data element might be used to indicate e.g. with the expected or booked balance that no action is known on the account, which is not yet booked.'
          format: date-time
          nullable: true
        referenceDate:
          type: string
          description: Indicates the date of the balance.
          format: date
          nullable: true
        lastCommittedTransaction:
          maxLength: 35
          minLength: 0
          type: string
          description: '''entryReference'' of the last committed transaction to support the TPP in identifying whether all  PSU transactions are already known.'
          nullable: true
      additionalProperties: false
      description: A single balance element.
    BalanceType:
      enum:
        - closingBooked
        - expected
        - openingBooked
        - interimAvailable
        - interimBooked
        - forwardAvailable
        - nonInvoiced
      type: string
      description: "<br>The following balance types are defined:\r\n<br>\r\n             *  \"closingBooked\":\r\n                    Balance of the account at the end of the pre-agreed account reporting period.\r\n                    It is the sum of the opening booked balance at the beginning of the period and all entries booked\r\n                    to the account during the pre-agreed account reporting period.\r\n                    For card-accounts, this is composed of:\r\n                        - invoiced, but not yet paid entries\r\n             *   \"expected\":\r\n                    Balance composed of booked entries and pending items known at the time of calculation,\r\n                    which projects the end of day balance if everything is booked on the account and no other entry is posted.\r\n                    For card accounts, this is composed of:\r\n                        - invoiced, but not yet paid entries\r\n                        - not yet invoiced but already booked entries and\r\n                        - pending items (not yet booked)\r\n                    For card-accounts: \\\"money to spend with the value of a pre-approved credit limit on the card account\\\"\r\n             *  \"openingBooked\":\r\n                    Book balance of the account at the beginning of the account reporting period.\r\n                    It always equals the closing book balance from the previous report.\r\n             *   \"interimAvailable\":\r\n                    Available balance calculated in the course of the account servicer's business day,\r\n                    at the time specified, and subject to further changes during the business day.\r\n                    The interim balance is calculated on the basis of booked credit and debit items during the calculation\r\n                    time/period specified.\r\n                    For card-accounts, this is composed of:\r\n                        - invoiced, but not yet paid entries\r\n                        - not yet invoiced but already booked entries\r\n                        - \\\"interimBooked\\\":\r\n                    Balance calculated in the course of the account servicer's business day, at the time specified,\r\n                    and subject to further changes during the business day.\r\n                    The interim balance is calculated on the basis of booked credit and debit items during the calculation time/period\r\n                    specified.\r\n             *   \"forwardAvailable\":\r\n                    Forward available balance of money that is at the disposal of the account owner on the date specified.\r\n             *   \"nonInvoiced\":\r\n                    Only for card accounts, to be checked yet.\r\n            "
    BookingStatus:
      enum:
        - booked
        - pending
        - both
        - information
        - all
      type: string
      description: "Permitted codes are \"booked\", \"pending\",\r\n\"both\" and “information”.\r\n\"booked\" shall be supported by the\r\nASPSP.\r\nTo support the \"pending\" and \"both\" feature\r\nis optional for the ASPSP, Error code if not\r\nsupported in the online banking frontend. If\r\nsupported, \"both\" means to request\r\ntransaction reports of transaction of\r\nbookingStatus either \"pending\" or\r\n\"booked\".\r\nTo support the \"information\" feature is\r\noptional for the ASPSP. Currently the\r\nbooking status “information” only covers\r\nstanding orders. Error code if not\r\nsupported."
    BulkPaymentInitiationRequest:
      required:
        - payments
      type: object
      properties:
        batchBookingPreferred:
          type: boolean
          nullable: true
        requestedExecutionDate:
          type: string
          format: date
          nullable: true
        acceptorTransactionDateTime:
          type: string
          format: date-time
          nullable: true
        debtorAccount:
          $ref: '#/components/schemas/AccountReference'
        paymentInformationId:
          maxLength: 35
          minLength: 0
          type: string
          nullable: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInitiationRequestBase'
      additionalProperties: { }
    CancellationsResponse:
      required:
        - cancellationIds
      type: object
      properties:
        cancellationIds:
          type: array
          items:
            type: string
      additionalProperties: false
    CardAccountByIdResponse:
      required:
        - cardAccount
      type: object
      properties:
        cardAccount:
          $ref: '#/components/schemas/CardAccountDetails'
      additionalProperties: false
      description: Card Account Data
    CardAccountDetails:
      required:
        - currency
        - maskedPan
      type: object
      properties:
        resourceId:
          type: string
          description: "This is the data element to be used in the path when retrieving data from a dedicated account.\r\nThis shall be filled, if addressable resource are created by the ASPSP on the /card-accounts endpoint."
          nullable: true
        maskedPan:
          maxLength: 35
          minLength: 0
          type: string
          description: "Primary Account Number (PAN) of the card in masked form.\r\nIn the context of a response to a \"/card-accounts\" endpoint, this is the PAN of the main card;\r\nin the context of a \"/cards\" endpoint, this identifies the specific card for that the information is presented.\r\nThis data element can be used in the body of the Consent Request Message for retrieving account access consent from this card.."
        currency:
          maxLength: 3
          minLength: 3
          pattern: '[A-Z]{3}'
          type: string
          description: ISO 4217 Alpha 3 currency code.
        debitAccounting:
          type: boolean
          description: "If true, the amounts of debits on the reports are quoted positive with the related consequence for balances.\r\nIf false, the amount of debits on the reports are quoted negative."
          nullable: true
        ownerName:
          maxLength: 140
          minLength: 0
          type: string
          description: " Name of the legal account owner. If there is more than one owner, then e.g. two names might be noted here.\r\nFor a corporate account, the corporate name is used for this attribute.Even if supported by the ASPSP,\r\nthe provision of this field might depend on the fact whether an explicit consent to this specific additional account information\r\nhas been given by the PSU."
          nullable: true
        name:
          maxLength: 70
          minLength: 0
          type: string
          description: "Name of the account, as assigned by the ASPSP,  in agreement with the account owner in order to\r\nprovide an additional means of identification of the account."
          nullable: true
        displayName:
          maxLength: 70
          minLength: 0
          type: string
          description: Name of the account as defined by the PSU within online channels.
          nullable: true
        product:
          maxLength: 35
          minLength: 0
          type: string
          description: 'Product Name of the Bank for this card/card account, proprietary definition.'
          nullable: true
        status:
          $ref: '#/components/schemas/AccountStatus'
        usage:
          $ref: '#/components/schemas/AccountUsage'
        details:
          maxLength: 500
          minLength: 0
          type: string
          description: "Specifications that might be provided by the ASPSP:\r\n*characteristics of the account,\r\n*characteristics of the relevant card"
          nullable: true
        creditLimit:
          $ref: '#/components/schemas/Amount'
        balances:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
          description: "The specific card account balances associated to this card / card account.\r\nIn the context of a response to a \"cards\" endpoint, each balance that indicates\r\nthat credit limit is included must respect all applicable credit limits relevant for this card ( cp. Section 6.6)"
          nullable: true
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HrefType'
          description: "Links to the card account/card, which can be directly used for retrieving account information from this dedicated account. Links to \"balances\" and/or\r\n\"transactions\" These links are only supported, when the corresponding consent has been already granted."
          nullable: true
      additionalProperties: false
      description: Card account details.
    CardAccountReport:
      required:
        - _links
        - booked
      type: object
      properties:
        booked:
          type: array
          items:
            $ref: '#/components/schemas/CardTransactionDetails'
          description: Array of transaction details.
        pending:
          type: array
          items:
            $ref: '#/components/schemas/CardTransactionDetails'
          description: Gets or Sets Pending
          nullable: true
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HrefType'
          description: Gets or Sets Links
      additionalProperties: false
      description: JSON based card account report.  This card account report contains transactions resulting from the query parameters.
    CardAccountsTransactionsResponse:
      type: object
      properties:
        cardAccount:
          $ref: '#/components/schemas/AccountReference'
        cardTransactions:
          $ref: '#/components/schemas/CardAccountReport'
        balances:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
          description: "A list of balances regarding this account,\r\nwhich might be restricted to the current balance"
          nullable: true
      additionalProperties: false
      description: "Body of the JSON response for a successful read card account transaction list request.\r\nThis card account report contains transactions resulting from the query parameters."
    CardTransactionDetails:
      required:
        - transactionAmount
      type: object
      properties:
        cardTransactionId:
          maxLength: 35
          minLength: 0
          type: string
          description: Unique end to end identity.
          nullable: true
        terminalId:
          maxLength: 35
          minLength: 0
          type: string
          description: 'Identification of the Terminal, where the card has been used.'
          nullable: true
        transactionDate:
          type: string
          description: Date of the actual card transaction.
          format: date
          nullable: true
        acceptorTransactionDateTime:
          type: string
          description: Timestamp of the actual card transaction within the acceptance system
          format: date-time
          nullable: true
        bookingDate:
          type: string
          description: The date when an entry is posted to an account on the ASPSPs books.
          format: date
          nullable: true
        transactionAmount:
          $ref: '#/components/schemas/Amount'
        currencyExchange:
          type: array
          items:
            $ref: '#/components/schemas/ForeignExchangeRate'
          description: 'For card accounts, this often is restricted by the ASPSP to use only one exchange rate'
          nullable: true
        originalAmount:
          $ref: '#/components/schemas/Amount'
        markupFee:
          $ref: '#/components/schemas/Amount'
        markupFeePercentage:
          type: string
          description: 'Percentage of the involved transaction fee in relation to the billing amount, e.g. "0.3" for 0,3%'
          nullable: true
        cardAcceptorId:
          maxLength: 35
          minLength: 0
          type: string
          description: Identification of the Card Acceptor (e.g. merchant) as given in the related card transaction.
          nullable: true
        cardAcceptorAddress:
          $ref: '#/components/schemas/Address'
        cardAcceptorPhone:
          pattern: '\+[0-9]{1,3}\-[0-9()+\-]{1,30}'
          type: string
          description: Merchant phone number
          nullable: true
        merchantCategoryCode:
          maxLength: 4
          minLength: 0
          type: string
          description: Merchant Category Code of the Card Acceptor as given in the related card transaction
          nullable: true
        maskedPAN:
          maxLength: 35
          minLength: 0
          type: string
          description: The masked PAN of the card used in the transaction.
          nullable: true
        transactionDetails:
          maxLength: 140
          minLength: 0
          type: string
          description: Additional details given for the related card transactions.
          nullable: true
        invoiced:
          type: boolean
          description: Flag indicating whether the underlying card transaction is already invoiced.
          nullable: true
        proprietaryBankTransactionCode:
          maxLength: 35
          minLength: 0
          type: string
          description: proprietary bank transaction code as used within a community or within an ASPSP e.g. for MT94x based transaction reports
          nullable: true
      additionalProperties: false
      description: Card transaction information.
    ChallengeData:
      type: object
      properties:
        image:
          type: string
          description: 'PNG data (max. 512 kilobyte) to be displayed to the PSU, Base64 encoding, cp. [RFC4648]. This attribute is used only, when PHOTO_OTP or CHIP_OTP is the selected SCA method.'
          format: byte
          nullable: true
        data:
          type: array
          items:
            type: string
          description: A collection of strings as challenge data.
          nullable: true
        imageLink:
          type: string
          description: A link where the ASPSP will provides the challenge image for the TPP.
          nullable: true
        otpMaxLength:
          type: integer
          description: The maximal length for the OTP to be typed in by the PSU.
          format: int32
          nullable: true
        otpFormat:
          $ref: '#/components/schemas/OtpFormat'
        additionalInformation:
          type: string
          description: Additional explanation for the PSU to explain e.g. fallback mechanism for the chosen SCA method. The TPP is obliged to show this to the PSU.
          nullable: true
      additionalProperties: false
      description: It is contained in addition to the data element 'chosenScaMethod' if challenge data is needed for SCA. In rare cases this attribute is also used in the context of the 'startAuthorisationWithPsuAuthentication' link.
    ChargeBearer:
      enum:
        - CRED
        - DEBT
        - SHAR
        - SLEV
      type: string
    ConsentStatus:
      enum:
        - received
        - rejected
        - valid
        - revokedByPsu
        - expired
        - terminatedByTpp
        - partiallyAuthorised
      type: string
      description: "This is the overall lifecycle status of the consent. Valid values are:\r\n* 'received': The consent data have been received and are technically correct. The data is not authorized yet.\r\n* 'rejected': The consent data have been rejected e.g. since no successful authorization has taken place.\r\n* 'valid': The consent is accepted and valid for GET account data calls and others as specified in the consent object.\r\n* 'revokedByPsu': The consent has been revoked by the PSU towards the ASPSP.\r\n* 'expired': The consent expired.\r\n* 'terminatedByTpp': The corresponding TPP has terminated the consent by applying the DELETE method to the consent resource.\r\n* 'partiallyAuthorised': The consent is due to a multi-level authorization, some but not all mandated authorizations have been performed yet.\r\nThe ASPSP might add further codes. These codes then shall be contained in the ASPSP's documentation of the XS2A interface  and has to be added to this API definition as well."
    CreateConsentRequestBody:
      required:
        - access
        - combinedServiceIndicator
        - frequencyPerDay
        - recurringIndicator
      type: object
      properties:
        access:
          $ref: '#/components/schemas/AccountAccess'
        recurringIndicator:
          type: boolean
          description: '''true'', if the consent is for recurring access to the account data. ''false'', if the consent is for one access to the account data.'
        validUntil:
          type: string
          description: "This parameter is defining a valid until date (including the mentioned date)\r\nfor the requested consent. The content is the local ASPSP date in ISO-Date format, e.g. 2017-10-30."
          format: date
        frequencyPerDay:
          type: integer
          description: "This field indicates the requested maximum frequency for an access without PSU involvement per day. For a one-off access, this attribute is set to \"1\".\r\nThe frequency needs to be greater equal to one.\r\nIf not otherwise agreed bilaterally between TPP and ASPSP, the frequency is less equal to 4."
          format: int32
        combinedServiceIndicator:
          type: boolean
          description: "If 'true' indicates that a payment initiation service will be addressed in the same 'session'.\r\nკომბინირებული სერვისები წინამდებარე დოკუმენტის ამ ვერსიის მიზნებისათვის, აუცილებელია,\r\ncombinedServiceIndicator ველში მიეთითოს მნიშვნელობა false,\r\nვინაიდან გადახდის ინიცირების მომსახურება ამ ვერსიაში განსაზღვრული არ არის."
      additionalProperties: { }
      description: Content of the body of a consent request.

  '/0.8/v1/card-accounts/{account-id}':
    get:
      tags:
        - CardAccounts
      summary: Read details about a card account
      description: "Reads details about a card account.\r\n            It is assumed that a consent of the PSU to this access is already given and stored on the ASPSP system.\r\n            The addressed details of this account depends then on the stored consent addressed by consentId, respectively the OAuth2  access token."
      parameters:
        - name: Consent-ID
          in: header
          description: 'ConsentId of the related AIS consent, which was performed prior to this payment initiation.'
          required: true
          schema:
            maxLength: 36
            minLength: 0
            type: string
        - name: account-id
          in: path
          description: This identification is denoting the addressed (card) account.  The account-id is retrieved by using a \"Read Account List\" or \"Read Card Account list\" call.  The account-id is the \"resourceId\" attribute of the account structure.  Its value is constant at least throughout the lifecycle of a given consent.
          required: true

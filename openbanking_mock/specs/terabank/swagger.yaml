  /0.8/v1/card-accounts:
    get:
      tags:
        - CardAccounts
      summary: Read a list of card accounts
      description: "Reads a list of card accounts with additional information, e.g. balance information.\r\n            It is assumed that a consent of the PSU to this access is already given and stored on the ASPSP system.\r\n            The addressed list of card accounts depends then on the PSU ID and the stored consent addressed by consentId,\r\n            respectively the OAuth2 access token."
      parameters:
        - name: Consent-ID

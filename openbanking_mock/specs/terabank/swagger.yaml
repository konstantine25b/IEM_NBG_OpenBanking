  '/0.8/v1/card-accounts/{account-id}/transactions':
    get:
      tags:
        - CardAccounts
      summary: Read transaction list of an account
      description: Reads account data from a given card account addressed by \"account-id\".
      parameters:
        - name: Consent-ID
          in: header
          description: 'ConsentId of the related AIS consent, which was performed prior to this payment initiation.'
          required: true
          schema:
            maxLength: 36
            minLength: 0
            type: string
        - name: account-id
          in: path
          description: This identification is denoting the addressed (card) account.  The account-id is retrieved by using a \"Read Account List\" or \"Read Card Account list\" call.  The account-id is the \"resourceId\" attribute of the account structure.  Its value is constant at least throughout the lifecycle of a given consent.
          required: true
          schema:
            type: string
        - name: bookingStatus
          in: query
          description: 'Permitted codes are    * \"information\",   * \"booked\",   * \"pending\", and    * \"both\" \"booked\" shall be supported by the ASPSP. To support the \"pending\" and \"both\" feature is optional for the ASPSP,  Error code if not supported in the online banking frontend'
          required: true
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: dateFrom
          in: query
          description: 'Conditional: Starting date (inclusive the date dateFrom) of the transaction list, mandated if no delta access is required and if bookingStatus does not equal \"information.  For booked transactions, the relevant date is the booking date.   For pending transactions, the relevant date is the entry date, which may not be transparent  neither in this API nor other channels of the ASPSP.'
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: 'End date (inclusive the data dateTo) of the transaction list, default is \"now\" if not given.   Might be ignored if a delta function is used.  For booked transactions, the relevant date is the booking date.   For pending transactions, the relevant date is the entry date, which may not be transparent  neither in this API nor other channels of the ASPSP.'
          schema:
            type: string
            format: date
        - name: deltaList
          in: query
          description: This data attribute is indicating that the AISP is in favour to get all transactions after the last report access for this PSU on the addressed account. This is another implementation of a delta access-report. This delta indicator might be rejected by the ASPSP if this function is not supported. Optional if supported by API provider
          schema:
            type: boolean
        - name: state
          in: query
          description: ''
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAccountsTransactionsResponse'
              examples:
                cardAccountsTransactionExample:
                  summary: Example of card account transaction
                  value: {"cardAccount":{"iban":"GE02AL0000000000118060","maskedPan":"418057**********6950","currency":"GEL"},"cardTransactions":{"booked":[{"transactionAmount":{"currency":"GEL","amount":"3520.45"},"maskedPAN":"418057**********6950"},{"transactionAmount":{"currency":"GEL","amount":"2520.00"},"maskedPAN":"418057**********6950"},{"transactionAmount":{"currency":"GEL","amount":"1520.86"},"maskedPAN":"418057**********6950"}],"_links":{"cardAccount":{"href":"v1/card-accounts/7b505906-074e-4e87-abd4-6424b4f621c0"},"first":{"href":"v1/card-accounts/7b505906-074e-4e87-abd4-6424b4f621c0/transactions?entryReferenceFrom=eyJBY2NvdW50UmVmZXJlbmNlSWQiOiI3YjUwNTkwNi0wNzRlLTRlODctYWJkNC02NDI0YjRmNjIxYzAiLCJTdGFydFRyYW5zYWN0aW9uUG9pbnRlciI6bnVsbCwiQm9va2luZ1N0YXR1cyI6MSwiRGF0ZUZyb20iOnt9LCJEYXRlVG8iOnt9LCJEZWx0YUxpc3QiOm51bGwsIldpdGhCYWxhbmNlIjp0cnVlfQ"},"next":{"href":"v1/card-accounts/7b505906-074e-4e87-abd4-6424b4f621c0/transactions?entryReferenceFrom=eyJBY2NvdW50UmVmZXJlbmNlSWQiOiI3YjUwNTkwNi0wNzRlLTRlODctYWJkNC02NDI0YjRmNjIxYzAiLCJTdGFydFRyYW5zYWN0aW9uUG9pbnRlciI6bnVsbCwiQm9va2luZ1N0YXR1cyI6MSwiRGF0ZUZyb20iOnt9LCJEYXRlVG8iOnt9LCJEZWx0YUxpc3QiOm51bGwsIldpdGhCYWxhbmNlIjp0cnVlfQ"},"last":{"href":"v1/card-accounts/7b505906-074e-4e87-abd4-6424b4f621c0/transactions?entryReferenceFrom=eyJBY2NvdW50UmVmZXJlbmNlSWQiOiI3YjUwNTkwNi0wNzRlLTRlODctYWJkNC02NDI0YjRmNjIxYzAiLCJTdGFydFRyYW5zYWN0aW9uUG9pbnRlciI6bnVsbCwiQm9va2luZ1N0YXR1cyI6MSwiRGF0ZUZyb20iOnt9LCJEYXRlVG8iOnt9LCJEZWx0YUxpc3QiOm51bGwsIldpdGhCYWxhbmNlIjp0cnVlfQ"},"previous":{"href":"v1/card-accounts/7b505906-074e-4e87-abd4-6424b4f621c0/transactions?entryReferenceFrom=eyJBY2NvdW50UmVmZXJlbmNlSWQiOiI3YjUwNTkwNi0wNzRlLTRlODctYWJkNC02NDI0YjRmNjIxYzAiLCJTdGFydFRyYW5zYWN0aW9uUG9pbnRlciI6bnVsbCwiQm9va2luZ1N0YXR1cyI6MSwiRGF0ZUZyb20iOnt9LCJEYXRlVG8iOnt9LCJEZWx0YUxpc3QiOm51bGwsIldpdGhCYWxhbmNlIjp0cnVlfQ"}}},"balances":[{"balanceAmount":{"currency":"GEL","amount":"100.60"},"balanceType":"interimAvailable","creditLimitIncluded":f
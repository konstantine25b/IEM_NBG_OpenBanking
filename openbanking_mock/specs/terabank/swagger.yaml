                $ref: '#/components/schemas/Error400'
              example: {"code":"FORMAT_ERROR","additionalErrors":[{"code":"FORMAT_ERROR","title":"Digest","detail":"The Digest field is required."},{"code":"FORMAT_ERROR","title":"Signature","detail":"The Signature field is required."}],"_links":{},"type":"https://berlingroup.com/error-codes/FORMAT_ERROR","title":"One or more validation errors occurred.","status":400,"instance":"/v1/consents","traceId":"00-4d8a7024a02bba4085b12f118f524e97-a062de5fc826614c-00"}

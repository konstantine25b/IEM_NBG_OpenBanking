  '/0.8/v1/accounts/{account-id}/balances':
    get:
      tags:
        - Accounts
      summary: Read balance
      description: "Reads account data from a given account addressed by 'account-id'.\r\n            **Remark:** This account-id can be a tokenised identification due to data protection reason since the path  information might be logged on intermediary servers within the ASPSP sphere.  This account-id then can be retrieved by the 'Get account list' call.  The account-id is constant at least throughout the lifecycle of a given consent."
      parameters:
        - name: Consent-ID
          in: header
          description: 'ConsentId of the related AIS consent, which was performed prior to this payment initiation.'
          required: true
          schema:
            maxLength: 36
            minLength: 0
            type: string
        - name: account-id
          in: path
          description: This identification is denoting the addressed (card) account. The account-id is retrieved by using a 'Read Account List' or 'Read Card Account list' call. The account-id is the 'resourceId' attribute of the account structure. Its value is constant at least throughout the lifecycle of a given consent.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
